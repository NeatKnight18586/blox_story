name: Visual V2 Opt-in Proof
on:
  pull_request:
    paths:
      - 'appearance/**'
      - 'production/**'
      - 'tests/v2-*.js'
      - '.github/workflows/visual-v2-proof.yml'
  workflow_dispatch:
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: node tests/v2-library.js
      - run: node tests/v2-browser.js
      - run: node tests/v2-sculpted-browser.js
      - run: node tests/v2-bacon-browser.js
      - name: Upload private review stills
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-mobile-look-tests
          path: renders/v2-lookdev/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload sculpted hair multiview study
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-sculpted-hair-multiview
          path: renders/v2-sculpted-reference/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload bacon native multiview proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-bacon-hair-review
          path: renders/v2-bacon-hair/*.png
          if-no-files-found: warn
          retention-days: 7
