name: Visual V2 — Four Final Hair Proof
on:
  pull_request:
    paths:
      - 'appearance/**'
      - 'production/**'
      - 'tests/v2-*.js'
      - '.github/workflows/visual-v2-proof.yml'
  workflow_dispatch:
jobs:
  hair-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Previous animation and story tests
        run: npm test
      - name: Reusable hair / casting unit checks
        run: node tests/v2-library.js
      - name: Standard versus toon renders
        run: node tests/v2-browser.js
      - name: Native four-angle hair and head-turn checks
        run: node tests/v2-final-hair-browser.js
      - name: Upload four-style comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-four-hair-preview
          path: renders/v2-lookdev/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload multiangle fit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-four-hair-multiangle
          path: renders/v2-final-hair/*.png
          if-no-files-found: warn
          retention-days: 7
