name: assets

# Phase R: CC0 asset cache (Poly Haven is blocked in cloud sessions). Downloads the set listed in assets/realism.json into
# an actions/cache entry (never committed; no file > 5 MB), then optionally runs the realism spike on the farm and commits
# only review/realism/* and assets/LICENSES.md back to the branch. Optional Blender headless bake probe (timed).
on:
  workflow_dispatch:
    inputs:
      measure: {description: run scripts/v2/realism.js + the A/B sheet, type: boolean, default: true}
      blender: {description: time a Blender install + one Cycles lightmap bake, type: boolean, default: true}
      city: {description: 'Phase 1B: city gate1b stills + sheet with the CC0 cache (commits review/city/1B-farm-*)', type: boolean, default: false}
      city1c: {description: 'Phase 1C: city gate1c stills + sheet with the CC0 cache (commits review/city/1C-farm-*)', type: boolean, default: false}
      look: {description: 'Look Signature: cityDay2 × outline A/B/C on the 4 key-art cameras + motion clip + bench (commits review/city/LOOK-*)', type: boolean, default: false}
      city1d: {description: 'Phase 1D: harbor + beach gate, every key-art anchor (staging rule) + gate rows bench, look B (commits review/city/1D-*)', type: boolean, default: false}
      city1e: {description: 'Phase 1E: fix-ups + wild edge + hero/impostor trees + suburb variety + time-of-day gate, look B (commits review/city/1E-*)', type: boolean, default: false}
      city1f: {description: 'Phase 1F: Governor + clock kit + anchor lock + time-of-day look fixes, look B (commits review/city/1F-*)', type: boolean, default: false}
  push:
    paths: ['assets/realism.request']

permissions:
  contents: write

concurrency:
  group: assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - name: Restore CC0 asset cache
        id: cache
        uses: actions/cache@v4
        with:
          path: renders/cache/assets
          key: cc0-${{ hashFiles('assets/realism.json') }}
      - name: Download from Poly Haven
        run: |
          python3 scripts/v2/fetch-assets.py
          find renders/cache/assets -type f -size +25M -print -exec false {} +   # textures ≤ 5 MB (fetch-assets), glTF model files ≤ 25 MB (Phase 1E)
          du -sh renders/cache/assets; cat renders/cache/assets/manifest.json
      - id: req
        name: Read the request line (a first line containing `city1b`, `city1c`, `looksig`, `city1d`, `city1e` or `city1f` runs only that city gate)
        run: echo "line=$(head -n1 assets/realism.request 2>/dev/null | tr -d '\r')" >> "$GITHUB_OUTPUT"
      - name: City 1B gate with CC0 textures (farm stills + sheet)
        if: inputs.city || (github.event_name == 'push' && contains(steps.req.outputs.line, 'city1b'))
        run: |
          npm ci
          npx playwright install --with-deps chromium || echo "browser.js falls back to the runner's google-chrome"
          pip install --break-system-packages pillow >/dev/null 2>&1 || pip install pillow
          node scripts/v2/tex4.js; node scripts/v2/matcap4.js
          node scripts/v2/city-gate.js --phase 1b --out renders/city1b-farm --sight review/city/1B-farm-sightlines.json
          python3 scripts/v2/city-sheet.py --phase 1b --dir renders/city1b-farm --sight review/city/1B-farm-sightlines.json --notes review/city/1B-notes.json --out review/city/1B-farm-sheet.png
          python3 -c "import json; print(json.load(open('review/city/1B-farm-sightlines.json'))['textures'])"
          git config user.name "blox-farm"; git config user.email "actions@users.noreply.github.com"
          git add review/city/1B-farm-sightlines.json review/city/1B-farm-sheet.png assets/LICENSES.md
          git diff --cached --quiet || { git commit -m "City 1B: farm gate stills with CC0 textures (run ${{ github.run_id }})"; git push origin HEAD:${{ github.ref_name }}; }
      - name: City 1C gate with CC0 textures (farm stills + sheet; statue / windows / paving / hero door measures)
        if: inputs.city1c || (github.event_name == 'push' && contains(steps.req.outputs.line, 'city1c'))
        run: |
          npm ci
          npx playwright install --with-deps chromium || echo "browser.js falls back to the runner's google-chrome"
          pip install --break-system-packages pillow >/dev/null 2>&1 || pip install pillow
          node scripts/v2/tex4.js; node scripts/v2/matcap4.js
          node scripts/v2/city-gate.js --phase 1c --out renders/city1c-farm --sight review/city/1C-farm-sightlines.json
          python3 scripts/v2/city-sheet.py --phase 1c --dir renders/city1c-farm --sight review/city/1C-farm-sightlines.json --notes review/city/1C-notes.json --out review/city/1C-farm-sheet.png
          python3 -c "import json; d=json.load(open('review/city/1C-farm-sightlines.json')); print(d['textures']); [print(k, v['anchor'], v['pass'], v.get('checks'), v.get('measures', {}).get('paving')) for k, v in d['shots'].items()]"
          git config user.name "blox-farm"; git config user.email "actions@users.noreply.github.com"
          git add review/city/1C-farm-sightlines.json review/city/1C-farm-sheet.png assets/LICENSES.md
          git diff --cached --quiet || { git commit -m "City 1C: farm gate stills with CC0 textures (run ${{ github.run_id }})"; git push origin HEAD:${{ github.ref_name }}; }
      - name: Look Signature gate with CC0 textures (key-art stills A/B/C, measures, bench, motion clip)
        if: inputs.look || (github.event_name == 'push' && contains(steps.req.outputs.line, 'looksig'))
        run: |
          npm ci
          npx playwright install --with-deps chromium || echo "browser.js falls back to the runner's google-chrome"
          pip install --break-system-packages pillow >/dev/null 2>&1 || pip install pillow
          command -v ffmpeg >/dev/null || { for i in 1 2 3 4 5; do sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y ffmpeg && break || sleep $((i*15)); done; }
          node scripts/v2/tex4.js; node scripts/v2/matcap4.js
          node scripts/v2/look-gate.js --out renders/look-farm --review review/city --prefix LOOK
          python3 scripts/v2/look-sheet.py --dir renders/look-farm --measures review/city/LOOK-measures.json --out review/city/LOOK-sheet.png --crops review/city/LOOK-crops.png
          git config user.name "blox-farm"; git config user.email "actions@users.noreply.github.com"
          git add review/city/LOOK-measures.json review/city/LOOK-sheet.png review/city/LOOK-crops.png review/city/LOOK-motion.mp4 assets/LICENSES.md engine/fixtures/city/look.json
          git diff --cached --quiet || { git commit -m "Look Signature: farm key-art stills A/B/C + motion with CC0 textures (run ${{ github.run_id }})"; git push origin HEAD:${{ github.ref_name }}; }
      - name: City 1D gate with CC0 textures (all key-art anchors 270 × 480, gate rows phone + bench, look B)
        if: inputs.city1d || (github.event_name == 'push' && contains(steps.req.outputs.line, 'city1d'))
        run: |
          npm ci
          npx playwright install --with-deps chromium || echo "browser.js falls back to the runner's google-chrome"
          pip install --break-system-packages pillow >/dev/null 2>&1 || pip install pillow
          node scripts/v2/tex4.js; node scripts/v2/matcap4.js
          node scripts/v2/city1d-gate.js --out renders/city1d-farm --review review/city
          python3 scripts/v2/city1d-sheet.py --dir renders/city1d-farm --measures review/city/1D-measures.json --out-all review/city/1D-keyart-all.png --out review/city/1D-sheet.png
          git config user.name "blox-farm"; git config user.email "actions@users.noreply.github.com"
          git add review/city/1D-measures.json review/city/1D-keyart-all.png review/city/1D-sheet.png assets/LICENSES.md engine/fixtures/city/gate1d.json
          git diff --cached --quiet || { git commit -m "City 1D: farm gate (all key art + harbor/beach rows, look B) with CC0 textures (run ${{ github.run_id }})"; git push origin HEAD:${{ github.ref_name }}; }
      - name: City 1E gate with CC0 textures + hero trees (all key art 270 × 480, gate rows phone + bench, bayNorth time-of-day, look B)
        if: inputs.city1e || (github.event_name == 'push' && contains(steps.req.outputs.line, 'city1e'))
        run: |
          npm ci
          npx playwright install --with-deps chromium || echo "browser.js falls back to the runner's google-chrome"
          pip install --break-system-packages pillow >/dev/null 2>&1 || pip install pillow
          node scripts/v2/tex4.js; node scripts/v2/matcap4.js
          python3 -c "import json; m=json.load(open('renders/cache/assets/manifest.json')); print({k: v['id'] + ' ' + str(v['bytes']) for k, v in m.get('models', {}).items()}); print(json.dumps(m.get('modelsConsidered', {}))[:3000])"
          node scripts/v2/city1e-gate.js --out renders/city1e-farm --review review/city --cache-impostors --no-bench --no-tod --rows plazaWide
          node scripts/v2/city1e-gate.js --out renders/city1e-farm --review review/city
          python3 scripts/v2/city1e-sheet.py --dir renders/city1e-farm --measures review/city/1E-measures.json --out-all review/city/1E-keyart-all.png --out review/city/1E-sheet.png --out-tod review/city/1E-tod.png
          python3 -c "import json; d=json.load(open('review/city/1E-measures.json')); print(d['pass']); print(d['fails']); print(json.dumps(d.get('trees'))[:1500])"
          git config user.name "blox-farm"; git config user.email "actions@users.noreply.github.com"
          git add review/city/1E-measures.json review/city/1E-keyart-all.png review/city/1E-sheet.png review/city/1E-tod.png assets/LICENSES.md engine/fixtures/city/gate1e*.json
          git diff --cached --quiet || { git commit -m "City 1E: farm gate (all key art + wild/suburb rows + time of day, look B) with CC0 textures + trees (run ${{ github.run_id }})"; git push origin HEAD:${{ github.ref_name }}; }
      - name: City 1F gate with CC0 textures (Governor sheet + balcony, clock clip, anchor lock, time of day + crops, bench, meme-gap audio fixture; look B)
        if: inputs.city1f || (github.event_name == 'push' && contains(steps.req.outputs.line, 'city1f'))
        run: |
          npm ci
          npx playwright install --with-deps chromium || echo "browser.js falls back to the runner's google-chrome"
          pip install --break-system-packages pillow numpy >/dev/null 2>&1 || pip install pillow numpy
          command -v ffmpeg >/dev/null || { for i in 1 2 3 4 5; do sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y ffmpeg && break || sleep $((i*15)); done; }
          node scripts/v2/tex4.js; node scripts/v2/matcap4.js
          node scripts/v2/city1f-gate.js --out renders/city1f-farm --review review/city
          python3 scripts/v2/city1f-sheet.py --dir renders/city1f-farm --measures review/city/1F-measures.json --out review/city
          python3 scripts/v2/memegap.py --fixture --out review/city
          python3 -c "import json; d=json.load(open('review/city/1F-measures.json')); print(d['pass']); print(json.dumps(d.get('bench'))); print(json.dumps(d.get('tod')))"
          git config user.name "blox-farm"; git config user.email "actions@users.noreply.github.com"
          git add review/city/1F-* assets/LICENSES.md engine/fixtures/city/gate1f*.json
          git diff --cached --quiet || { git commit -m "City 1F: farm gate (Governor, clock kit, anchor lock, time of day, look B) with CC0 textures (run ${{ github.run_id }})"; git pull --rebase origin ${{ github.ref_name }} || true; git push origin HEAD:${{ github.ref_name }}; }
      - name: Realism spike (farm numbers + sheet)
        if: (github.event_name == 'push' && !contains(steps.req.outputs.line, 'city1b') && !contains(steps.req.outputs.line, 'city1c') && !contains(steps.req.outputs.line, 'looksig') && !contains(steps.req.outputs.line, 'city1d') && !contains(steps.req.outputs.line, 'city1e') && !contains(steps.req.outputs.line, 'city1f')) || inputs.measure
        run: |
          npm ci
          npx playwright install --with-deps chromium || echo "browser.js falls back to the runner's google-chrome"
          pip install --break-system-packages pillow >/dev/null 2>&1 || pip install pillow
          node scripts/v2/tex4.js; node scripts/v2/matcap4.js   # baked matcap cache, as render.yml does (R2 actors use the comedy matcap)
          node scripts/v2/realism.js --out review/realism
          node scripts/v2/realism.js --out review/realism/basic --q '&static=basic' --stills renders/realism-basic
          python3 scripts/v2/realism-ab.py
          cat review/realism/realism.json | head -c 4000
      - name: Blender headless bake probe
        if: (github.event_name == 'push' && !contains(steps.req.outputs.line, 'city1b') && !contains(steps.req.outputs.line, 'city1c') && !contains(steps.req.outputs.line, 'looksig') && !contains(steps.req.outputs.line, 'city1d') && !contains(steps.req.outputs.line, 'city1e') && !contains(steps.req.outputs.line, 'city1f')) || inputs.blender
        run: |
          t0=$(date +%s); sudo apt-get update -qq && sudo apt-get install -y -qq blender >/dev/null; t1=$(date +%s)
          blender --version | head -1
          /usr/bin/time -v blender -b --python scripts/v2/blender-bake-probe.py -- review/realism/blender-bake.json 2> bake-time.txt || true
          grep -E "Elapsed|Maximum resident" bake-time.txt || true
          python3 - "$((t1 - t0))" <<'EOF'
          import json, sys
          p = 'review/realism/blender-bake.json'
          try: d = json.load(open(p))
          except Exception: d = {'error': 'bake did not run'}
          d['installSeconds'] = int(sys.argv[1]); json.dump(d, open(p, 'w'), indent=1); print(d)
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: realism, path: 'review/realism/', retention-days: 14}
      - name: Commit review material (never the assets)
        if: (github.event_name == 'push' && !contains(steps.req.outputs.line, 'city1b') && !contains(steps.req.outputs.line, 'city1c') && !contains(steps.req.outputs.line, 'looksig') && !contains(steps.req.outputs.line, 'city1d') && !contains(steps.req.outputs.line, 'city1e') && !contains(steps.req.outputs.line, 'city1f')) || inputs.measure || inputs.blender
        run: |
          git config user.name "blox-farm"; git config user.email "actions@users.noreply.github.com"
          git add review/realism assets/LICENSES.md
          git diff --cached --quiet || { git commit -m "Phase R: farm realism numbers + sheet (run ${{ github.run_id }})"; git push origin HEAD:${{ github.ref_name }}; }
