      add(actor('NOVA', {at: [0, 0, 6], yaw: 0, pose: 'walk', t: .4})); add(actor('LEO', {at: [an.leoChair[0] + .6, .9 - .2, an.leoChair[2]], yaw: Math.PI / 2, pose: 'slump'}));
