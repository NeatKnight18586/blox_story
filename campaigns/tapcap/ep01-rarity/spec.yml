# TapCap EP01 "Rarity's Just Paint" — episode spec (sponsored side project; rules: ../RULES.md)
slug: tapcap-ep01-rarity
campaign: tapcap
vo: vo/vo.wav            # 75.16 s, owner drop (gitignored, never committed)
vo_end: 75.16            # hard cut
fps: 24                  # owner (Pass A revision §2)
format_out: {width: 1080, height: 1920}
sfx: on                  # clicks only
click: {synth: click, ms: 40, peak_dbfs: -6}   # scripts/v2/sfx.py synth('click'): sharp transient + short plastic body
tap: {depth: 0.03, down: 3, hold: 2, up: 4}   # fraction of H / frames (engine/tapcap.js TAP)
music: none              # owner adds music
captions: {style: pop-shorts-v6, accent: "#B98CFF"}   # v6 from Phase 6 (merged 359c8f5)
cast:
  slimeguy: {asset: ../assets/slimeguy, presets: [frozen, grape, bubblegum, midnight, banana, pumpkin, strawberry, coffee, cosmic]}
  banana: {preset: banana}
  sunny: {preset: cosmic, paint: fake_banana, fleck_shot: S12}
  clix: {asset: ../assets/clix, rig: R6-satin, height_h: 40, face: grin, arm_only: [S18, S19, S20, S21], reveal: S36, closeup: S38}   # face pick pending (#2 grin · #5 content · #32 calm)
crowd: {count: [20, 40], idle: [sway, hop, tap]}
signs: ["1 / 102", "TOP SHELF", "CORE ROW", "TRADES"]
lighting:
  - {from: 0.00, to: 38.0, preset: dawn-hope}
  - {from: 38.0, to: 64.5, preset: rain-night, lightning_max: 1}
  - {from: 64.5, to: 75.16, preset: golden}
qa: {proportions: qa/proportions.json, measured: qa/measured.json}
loop: {first: S1, last: S40, rule: "S40 replays S1's camera move exactly; last frames identical (diff 0)"}
