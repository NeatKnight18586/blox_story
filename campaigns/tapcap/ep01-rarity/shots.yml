- {id: S19, clix: arm, t: [32.43, 35.74], plan: "Crowd gasps up at it."}
- {id: S20, clix: arm, t: [32.43, 35.74], plan: "The flat blue arm end approaches Banana's head (85 mm, motion blur). Arm only."}
