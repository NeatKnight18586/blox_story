- {id: S32, t: [56.32, 59.51], vo: "Every night, he'd painted himself yellow just to sneak down to the box,", plan: "Flash sequence (desaturated, slight vignette): Sunny alone on the plinth at night, painting yellow, hopping down into the Box."}
