- {id: S1, t: [0.00, 2.22], vo: "In Slime Town, you're born your *rarity*.", hero: 1, plan: "Low macro wide through a glossy mixed-colour crowd, hill + empty plinth behind. Push-in + single opening jolt at 0:00. A TapCap fills ≥ 30 % of frame 1."}
- {id: S2, t: [2.56, 5.47], vo: "And only one in every *102* is born *Cosmic*.", plan: "Whip to the '1 / 102' sign, snap-zoom on '102'."}
- {id: S3, t: [2.56, 5.47], plan: "Crane up the hill to the empty plinth in its spotlight."}
