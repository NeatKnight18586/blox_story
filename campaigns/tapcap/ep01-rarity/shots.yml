- {id: S34, t: [61.74, 63.32], vo: "'Rarity's just paint,' he said.", plan: "Present: Sunny facing Banana, smile arc, rain easing."}
- {id: S35, t: [63.65, 64.49], vo: "'I wanted a *friend*.'", plan: "Banana joy face, tear-like raindrop slides off his drip. Push-in."}
