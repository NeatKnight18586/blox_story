<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlockStory · Avatar</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f0ed;color:#292d31;font:15px system-ui,sans-serif}main{max-width:960px;margin:auto;padding:18px}h1{font-size:22px;margin:0}p{color:#60666c}#stage{height:min(68vh,620px);min-height:350px;border-radius:12px;overflow:hidden;background:#d5d6d7}canvas{display:block;width:100%;height:100%}.controls{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px}label{display:grid;gap:5px;font-size:13px}select,button{font:inherit;padding:12px;border:1px solid #b7bcc0;border-radius:7px;background:white;color:#292d31}#error{color:#a32323}</style><script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head><body><main><h1>BlockStory · The base avatar</h1><p>One simple body. A face and a little personality.</p><div id="stage"></div><div class="controls"><label>Pose<select id="pose"><option value="neutral">Neutral</option><option value="walk_demo">Walk demo</option><option value="look_down">Look down</option></select></label><label>Face<select id="face"><option value="classic_smile">Classic smile</option><option value="blank">Blank</option><option value="worried">Worried</option></select></label><label>View<select id="view"><option value="front">Front</option><option value="threequarter">Three-quarter</option><option value="side">Side</option><option value="closeup">Face close-up</option></select></label><label>Cosmetic<select id="cosmetic"><option value="">None</option><option value="cap">Cap</option></select></label><button id="play">Play walk demo</button><label>Action<select id="action"><option value="legacy">F1 poses</option><option value="idle">Idle</option><option value="look_react">Look / react</option></select></label><label>Direction<select id="direction"><option value="right">Right</option><option value="left">Left</option></select></label><label>Time (seconds)<input id="time" type="range" min="0" max="3" step="0.03333333333333333" value="0"><output id="timestamp">0.000 s</output></label><button id="previous">−1 frame</button><button id="next">+1 frame</button><button id="motionPlay">Play action</button></div><p>F2A: idle and look/react, with 0.25-second transitions. Frame steps use 30 fps. The legacy F1 walk is only a pose demo; F2 walking is deferred.</p><p id="error" role="alert"></p></main><script type="module" src="./preview.js"></script></body></html>
